/* A quarter smaller, with the full envelope always inside the viewport. */
#studio-welcome.letter-shaped-popup{width:min(510px,92vw,calc((100svh - 28px)*.918));max-height:calc(100svh - 28px);overflow:hidden}
#studio-welcome.letter-shaped-popup .welcome-letter-content{left:18%;width:64%;top:26%}
#studio-welcome.letter-shaped-popup h2{height:36px;margin:0 0 12px}
#studio-welcome.letter-shaped-popup h2 img{width:72%;left:14%}
#studio-welcome.letter-shaped-popup .welcome-copy{font-size:11px;line-height:1.5;margin:0 0 12px}
#studio-welcome.letter-shaped-popup input[type=email]{width:76%;margin:0 auto;padding:7px 9px;font-size:12px;line-height:1.2}
#studio-welcome.letter-shaped-popup .button{display:block;width:76%;margin:12px auto 0;padding:7px 10px;font-size:11px;line-height:1.2}
#studio-welcome.letter-shaped-popup .newsletter-fineprint{margin-top:12px;font-size:9px!important;line-height:1.4!important}
.studio-mail-intro .footer-lettering{position:relative;max-width:260px;width:100%;height:43px;margin:0 0 8px;overflow:hidden}
.studio-mail-intro .footer-lettering img{position:absolute;width:100%;max-width:none;height:auto;left:0;top:50%;transform:translateY(-54%);object-fit:initial}
.studio-footer-signup .studio-newsletter-form .button{margin-top:13px}
@media(max-width:480px){#studio-welcome.letter-shaped-popup .welcome-letter-content{left:15%;width:70%}#studio-welcome.letter-shaped-popup h2{height:28px;margin-bottom:7px}#studio-welcome.letter-shaped-popup h2 img{width:70%;left:15%}#studio-welcome.letter-shaped-popup .welcome-copy{font-size:10px;line-height:1.4;margin-bottom:8px}#studio-welcome.letter-shaped-popup input[type=email]{width:78%;padding:6px 8px;font-size:11px}#studio-welcome.letter-shaped-popup .button{width:78%;padding:6px 8px;font-size:10px;margin-top:8px}#studio-welcome.letter-shaped-popup .newsletter-fineprint{font-size:8px!important;line-height:1.4!important;margin-top:8px}.studio-mail-intro .footer-lettering{height:36px}}

.bf-builder{max-width:1120px;margin:0 auto;padding:0 5%}
.bf-fine{font-size:12px;line-height:1.7;color:var(--muted);margin:18px 0 0}
.bf-dialog{width:min(440px,92vw);padding:30px 28px 26px;text-align:left}
.bf-dialog::backdrop{background:rgba(56,44,40,.35)}
.bf-dialog h2{font:400 28px/1.2 Arial,Helvetica,sans-serif;letter-spacing:-.6px;margin:10px 0 10px}
.bf-dialog-text,.bf-dialog-done p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 16px}
.bf-dialog input[type=email]{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;font:15px Arial,Helvetica,sans-serif;color:var(--ink);box-sizing:border-box}
.bf-dialog .button{width:100%;margin-top:14px;padding:13px 16px;font-size:12px;cursor:pointer}
.bf-dialog-close{position:absolute;top:10px;right:12px;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:6px}
.bf-consent{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-size:12px;line-height:1.55;color:var(--ink)}
.bf-consent input{margin-top:2px;width:17px;height:17px;flex:none}
.bf-unlock-msg{margin:10px 0 0;color:var(--wine);font-size:13px}
.bf-unlock-msg:empty{display:none}
.bf-link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:12px;cursor:pointer;white-space:nowrap}
.bf-b-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:14px}
.bf-b-head h2{font:400 34px/1.15 Arial,Helvetica,sans-serif;margin:8px 0 0;letter-spacing:-.8px}
.bf-b-price{font:20px Arial,Helvetica,sans-serif;margin:0;white-space:nowrap}
.bf-b-price s{font:15px Arial,sans-serif;color:var(--muted);margin-left:6px}
.bf-b-sub{color:var(--muted);margin:8px 0 22px;font-size:13px}
.bf-journals{display:grid;gap:12px}
.bf-j{border:1px solid var(--line);background:#fff}
.bf-j.is-closed{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px 10px 10px}
.bf-j-thumb svg{width:52px;height:52px;display:block}
.bf-j-sum{display:flex;flex-direction:column;gap:2px;min-width:0}
.bf-j-sum strong{font-weight:normal;font-size:14px}
.bf-j-sum>span{font-size:12px;line-height:1.5;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bf-tick{color:#526047;margin-left:4px}
.bf-j.is-closed:not(.is-done) .bf-j-sum>span{color:var(--wine)}
.bf-j.is-open{padding:18px 20px 20px;border-color:var(--ink)}
.bf-j-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.bf-j-head strong{font-weight:normal;font-size:16px}
.bf-j-head span{font-size:12px;color:var(--muted)}
.bf-j-body{display:block}
.bf-field-leather{min-width:0}
.bf-b-layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:44px;align-items:start}
.bf-b-main{min-width:0}
.bf-stage{background:#eee8df;text-align:center}
.bf-stage-desk{position:sticky;top:20px;padding:26px 24px 22px}
.bf-stage-pic svg{width:100%;height:auto;display:block}
.bf-stage-desk .bf-stage-pic{max-width:470px;margin:10px auto 0}
.bf-stage-name{font:22px/1.3 Georgia,serif;color:var(--ink);margin:12px 0 4px}
.bf-stage-detail{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.bf-stage-card{display:none}
.bf-j.is-closed{cursor:pointer}
.bf-j.is-closed:hover{border-color:var(--muted)}
.bf-j-fields{display:grid;gap:16px;min-width:0}
.bf-label{font-size:12px;color:var(--muted);margin:0 0 8px}
.bf-label strong{font-weight:normal;color:var(--ink)}
.bf-label small,.bf-field small{font-size:11px;color:var(--muted)}
.bf-sws{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px}
.bf-sw{padding:0;border:1px solid var(--line);background:#fff;aspect-ratio:1;cursor:pointer;position:relative}
.bf-sw img{width:100%;height:100%;object-fit:cover;display:block}
.bf-sw.on{outline:2px solid var(--ink);outline-offset:2px;border-color:var(--ink)}
.bf-sw:disabled{opacity:.3;cursor:default}
.bf-sw:disabled:after{content:'';position:absolute;left:-2px;right:-2px;top:50%;border-top:1px solid var(--ink);transform:rotate(-45deg)}
.bf-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bf-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.bf-field select,.bf-field input{border:1px solid var(--line);background:#fff;padding:10px 11px;font:14px Arial,Helvetica,sans-serif;color:var(--ink);width:100%;box-sizing:border-box;border-radius:0}
.bf-field input{text-transform:uppercase;letter-spacing:.12em}
.bf-field input::placeholder{text-transform:none;letter-spacing:0}
.bf-charm-field .bf-label{margin:0}
.bf-charm-pick{display:flex;align-items:center;gap:12px;font-size:13px}
.bf-charm-pick .bf-charm-photo{width:52px;flex:none;border:1px solid var(--line)}
.bf-charm-btn{width:100%;padding:12px 14px;font-size:12px;cursor:pointer}
.bf-note{font-size:12px;color:var(--wine);margin:8px 0 0}
.bf-bar{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper);border-top:1px solid var(--line);padding:12px 0;margin-top:18px}
.bf-bar-text{margin:0;font-size:13px;color:var(--muted)}
.bf-bar .button{padding:13px 22px;font-size:12px;cursor:pointer;white-space:nowrap}
.bf-bar .button:not(.is-ready){opacity:.55}
.bf-error{color:var(--wine);font-size:13px;margin:6px 0 0}
.bf-error:empty{display:none}
.bf-chips{display:flex;flex-wrap:wrap;gap:7px}
.bf-chip{border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:12px;color:var(--ink);cursor:pointer}
.bf-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bf-charm-dialog{width:min(700px,94vw);max-height:88vh;overflow-y:auto}
.bf-finish{margin:0 0 12px}
.bf-charms{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px}
.bf-charm{border:1px solid var(--line);background:var(--paper);padding:0 0 4px;display:flex;flex-direction:column;align-items:stretch;font-size:10px;color:var(--muted);cursor:pointer}
.bf-charm-photo{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--paper)}
.bf-charm-photo img{position:absolute;max-width:none;object-fit:contain;mix-blend-mode:multiply}
.bf-charm-id{display:block;margin-top:2px}
.bf-charm.on{border:2px solid var(--ink);color:var(--ink);font-weight:bold}
@media(max-width:900px){.bf-sets{grid-template-columns:repeat(2,minmax(0,1fr))}.bf-b-layout{grid-template-columns:minmax(0,1fr)}.bf-stage-desk{display:none}.bf-stage-card{display:block;padding:16px 12px 14px;margin:0 0 16px}.bf-stage-card .bf-stage-pic{max-width:300px;margin:0 auto}.bf-sws{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-width:700px){.bf-banner{aspect-ratio:auto;height:min(128vw,560px);max-height:none;align-items:end;margin-bottom:34px}.bf-banner:after{content:&quot;&quot;;position:absolute;inset:0;background:linear-gradient(to bottom,rgba(246,243,238,0) 56%,rgba(246,243,238,.9) 86%);pointer-events:none}.bf-banner-photo img{object-position:33% 50%}.bf-banner-copy{width:100%;text-align:center;padding:0 7% 20px}.bf-when{margin:0 auto;max-width:330px}.bf-banner h1{font-size:36px;letter-spacing:-.8px}.bf-sets{gap:26px 14px;padding:0 4%}.bf-set h2{font-size:14px;margin-top:12px}.bf-includes{font-size:11px}.bf-set .button{padding:11px 8px;font-size:11px}.bf-builder{padding:0 4%}body.bf-building .bf{padding-top:20px}.bf-b-head{flex-direction:column;align-items:flex-start;gap:4px}.bf-b-head h2{font-size:26px}.bf-b-sub{margin-bottom:16px}.bf-j.is-open{padding:14px 12px 16px}.bf-stage-card .bf-stage-pic{max-width:230px}.bf-stage-name{font-size:19px;margin-top:8px}.bf-sws{display:flex;overflow-x:auto;gap:6px;padding:3px 2px 6px;scroll-snap-type:x proximity}.bf-sw{flex:0 0 46px;height:46px;scroll-snap-align:start}.bf-row{grid-template-columns:repeat(2,minmax(0,1fr))}.bf-row .bf-field:last-child{grid-column:1/-1}.bf-field select,.bf-field input{font-size:16px}.bf-bar{gap:10px;padding:10px 0}.bf-bar-text{font-size:12px}.bf-bar .button{padding:12px 14px}.bf-charms{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}.bf-dialog{padding:26px 16px 20px}.bf-charm-dialog h2{font-size:21px;padding-right:26px}}
